
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>חיזוי דירוג סרטים</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0f1a;
      --surface:  #151824;
      --border:   #252840;
      --accent:   #e2b96f;
      --accent2:  #7c6af7;
      --text:     #e8eaf0;
      --muted:    #7a7f99;
      --error:    #e2635a;
      --success:  #5ae2a0;
      --radius:   12px;
    }

    body {
      font-family: 'Heebo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 16px 60px;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 40px;
    }

    .star-row {
      font-size: 28px;
      letter-spacing: 6px;
      margin-bottom: 12px;
      color: var(--accent);
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    h1 span {
      color: var(--accent);
    }

    .subtitle {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 300;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 40px;
      width: 100%;
      max-width: 560px;
    }

    .section-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent2);
      margin-bottom: 20px;
    }

    /* ── Fields ── */
    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 7px;
    }

    label .hint {
      font-weight: 300;
      color: var(--muted);
      font-size: 0.8rem;
      margin-right: 6px;
    }

    input, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 14px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      transition: border-color 0.2s;
      outline: none;
      text-align: right;
    }

    input::placeholder { color: var(--muted); }
    input:focus, select:focus { border-color: var(--accent2); }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* Genre checkboxes */
    .genre-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 4px;
    }

    .genre-chip {
      position: relative;
    }

    .genre-chip input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .genre-chip label {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 7px 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 400;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.18s;
      text-align: center;
      margin-bottom: 0;
    }

    .genre-chip input[type="checkbox"]:checked + label {
      background: rgba(124, 106, 247, 0.15);
      border-color: var(--accent2);
      color: var(--text);
      font-weight: 600;
    }

    .genre-chip label:hover {
      border-color: var(--muted);
      color: var(--text);
    }

    /* ── Button ── */
    .btn {
      width: 100%;
      margin-top: 28px;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent2), #a78bfa);
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:hover  { opacity: 0.92; }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Result ── */
    #result {
      margin-top: 24px;
      border-radius: var(--radius);
      overflow: hidden;
      display: none;
    }

    .result-success {
      background: rgba(90, 226, 160, 0.08);
      border: 1px solid var(--success);
      padding: 24px 28px;
      text-align: center;
    }

    .result-label {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--success);
      margin-bottom: 10px;
    }

    .result-value {
      font-size: 3rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }

    .result-sub {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .result-error {
      background: rgba(226, 99, 90, 0.08);
      border: 1px solid var(--error);
      padding: 18px 24px;
      color: var(--error);
      font-size: 0.9rem;
      text-align: center;
    }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-left: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Divider ── */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="star-row">★ ★ ★</div>
    <h1>חיזוי <span>דירוג סרטים</span></h1>
    <p class="subtitle">הכנס פרטי סרט וקבל תחזית דירוג מבוססת למידת מכונה</p>
  </header>

  <div class="card">
    <div class="section-label">פרטי הסרט</div>

    <!-- Row 1: year + runtime -->
    <div class="row-2">
      <div class="field">
        <label>שנת יציאה <span class="hint">1900–2025</span></label>
        <input type="number" id="startYear" placeholder="2020" min="1900" max="2025" />
      </div>
      <div class="field">
        <label>אורך <span class="hint">בדקות</span></label>
        <input type="number" id="runtimeMinutes" placeholder="105" min="1" max="500" />
      </div>
    </div>

    <!-- Row 2: language + country -->
    <div class="row-2">
      <div class="field">
        <label>שפה ראשית</label>
        <select id="Language">
          <option value="">בחר שפה...</option>
          <option value="English">English</option>
          <option value="French">French</option>
          <option value="Spanish">Spanish</option>
          <option value="German">German</option>
          <option value="Italian">Italian</option>
          <option value="Japanese">Japanese</option>
          <option value="Korean">Korean</option>
          <option value="Mandarin">Mandarin</option>
          <option value="Hindi">Hindi</option>
          <option value="Arabic">Arabic</option>
          <option value="Hebrew">Hebrew</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="field">
        <label>מדינת ייצור</label>
        <select id="Country">
          <option value="">בחר מדינה...</option>
          <option value="United States">United States</option>
          <option value="United Kingdom">United Kingdom</option>
          <option value="France">France</option>
          <option value="Germany">Germany</option>
          <option value="Italy">Italy</option>
          <option value="Spain">Spain</option>
          <option value="Japan">Japan</option>
          <option value="South Korea">South Korea</option>
          <option value="China">China</option>
          <option value="India">India</option>
          <option value="Israel">Israel</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>

    <hr class="divider" />

    <!-- Genre checkboxes -->
    <div class="field">
      <label>ז'אנרים <span class="hint">ניתן לבחור יותר מאחד</span></label>
      <div class="genre-grid">
        <div class="genre-chip"><input type="checkbox" id="g_Drama"       value="Drama">      <label for="g_Drama">Drama</label></div>
        <div class="genre-chip"><input type="checkbox" id="g_Comedy"      value="Comedy">     <label for="g_Comedy">Comedy</label></div>
        <div class="genre-chip"><input type="checkbox" id="g_Documentary" value="Documentary"><label for="g_Documentary">Docu</label></div>
        <div class="genre-chip"><input type="checkbox" id="g_Horror"      value="Horror">     <label for="g_Horror">Horror</label></div>
        <div class="genre-chip"><input type="checkbox" id="g_Action"      value="Action">     <label for="g_Action">Action</label></div>
        <div class="genre-chip"><input type="checkbox" id="g_Romance"     value="Romance">    <label for="g_Romance">Romance</label></div>
        <div class="genre-chip"><input type="checkbox" id="g_Thriller"    value="Thriller">   <label for="g_Thriller">Thriller</label></div>
        <div class="genre-chip"><input type="checkbox" id="g_Crime"       value="Crime">      <label for="g_Crime">Crime</label></div>
      </div>
    </div>

    <button class="btn" id="predictBtn" onclick="predict()">
      חזה דירוג
    </button>

    <div id="result"></div>
  </div>

  <script>
    async function predict() {
      const btn = document.getElementById('predictBtn');
      const resultDiv = document.getElementById('result');

      // Collect genres from checkboxes
      const checkedGenres = [...document.querySelectorAll('.genre-chip input:checked')]
        .map(cb => cb.value);
      const genresStr = checkedGenres.length > 0 ? checkedGenres.join(',') : 'Drama';

      const payload = {
        startYear:      document.getElementById('startYear').value.trim(),
        runtimeMinutes: document.getElementById('runtimeMinutes').value.trim(),
        genres:         genresStr,
        Language:       document.getElementById('Language').value,
        Country:        document.getElementById('Country').value,
      };

      // Basic client-side validation
      if (!payload.startYear || !payload.runtimeMinutes) {
        showError('נא למלא שנת יציאה ואורך הסרט');
        return;
      }
      if (!payload.Language) {
        showError('נא לבחור שפה');
        return;
      }
      if (!payload.Country) {
        showError('נא לבחור מדינת ייצור');
        return;
      }

      // Loading state
      btn.disabled = true;
      btn.innerHTML = 'מחשב תחזית <span class="spinner"></span>';
      resultDiv.style.display = 'none';

      try {
        const response = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await response.json();

        if (!response.ok) {
          showError(data.error || 'שגיאה בקבלת התחזית');
        } else {
          showSuccess(data.predicted_rating);
        }
      } catch (err) {
        showError('לא ניתן להתחבר לשרת. ודאי שהשרת פועל.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'חזה דירוג';
      }
    }

    function showSuccess(rating) {
      const resultDiv = document.getElementById('result');
      const stars = ratingToStars(rating);
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = `
        <div class="result-success">
          <div class="result-label">דירוג חזוי</div>
          <div class="result-value">${rating} <span style="font-size:1.4rem;color:var(--muted)">/10</span></div>
          <div class="result-sub">${stars}</div>
        </div>`;
    }

    function showError(msg) {
      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = `<div class="result-error">⚠️ ${msg}</div>`;
    }

    function ratingToStars(r) {
      const full  = Math.round(r / 2);
      const empty = 5 - full;
      return '★'.repeat(full) + '☆'.repeat(empty);
    }
  </script>

</body>
</html>
